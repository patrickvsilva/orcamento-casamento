services:
  postgres:
    image: postgres:16-alpine
    container_name: orcamento-casamento-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: orcamento
      POSTGRES_PASSWORD: orcamento
      POSTGRES_DB: orcamento_casamento
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orcamento -d orcamento_casamento']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
